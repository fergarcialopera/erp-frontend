# Fragmento nginx recomendado para PWA (incluir en el server {} del frontend).
# Sin esto, Chrome a menudo muestra «Esta aplicación no se puede instalar»
# si el manifest/SW se sirven como text/html por el fallback SPA.

# MIME del manifest
types {
    application/manifest+json  webmanifest;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
}

location ^~ /workbox- {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /favicon/ {
    try_files $uri =404;
}

# SPA fallback: no debe tragarse manifest/sw/workbox/favicon
location / {
    try_files $uri $uri/ /index.html;
}
